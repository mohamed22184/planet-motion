<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- علامة Planet Motion. الكيفريم اتشال من الفافيكون:
       عند 16px كان بيبقى نقطة مالهاش معنى وبيوسّخ الصورة الظلية. -->
  <rect width="32" height="32" fill="#140F0D"/>
  <g transform="translate(16 16)">
    <circle r="7" fill="#E65100"/>
    <ellipse rx="12.4" ry="4.4" transform="rotate(-22)"
             fill="none" stroke="#E65100" stroke-width="2"/>
  </g>
</svg>
